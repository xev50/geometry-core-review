<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Comms</title>
    <style>
        :root {
            --bg-server: #1e1f22;
            --bg-sidebar: #2b2d31;
            --bg-chat: #313338;
            --text-main: #dbdee1;
            --text-muted: #949ba4;
            --accent: #5865F2;
            --hover: #3f4147;
        }

        [data-theme="light"] {
            --bg-server: #e3e5e8;
            --bg-sidebar: #f2f3f5;
            --bg-chat: #ffffff;
            --text-main: #313338;
            --text-muted: #5c5e66;
            --accent: #5865F2;
            --hover: #e0e1e5;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-chat);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Far Left Server Bar */
        .server-bar {
            width: 72px;
            background-color: var(--bg-server);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 12px;
            gap: 10px;
        }
        .server-icon {
            width: 48px;
            height: 48px;
            background-color: var(--bg-chat);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }
        .server-icon:hover {
            border-radius: 16px;
            background-color: var(--accent);
            color: white;
        }
        .active-server {
            border-radius: 16px;
            background-color: var(--accent);
            color: white;
        }

        /* Channel Sidebar */
        .sidebar {
            width: 240px;
            background-color: var(--bg-sidebar);
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 16px;
            font-weight: bold;
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .channel-list {
            padding: 10px;
            flex-grow: 1;
            overflow-y: auto;
        }
        .channel {
            padding: 8px;
            margin-bottom: 2px;
            cursor: pointer;
            border-radius: 4px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .channel:hover, .channel.active {
            background-color: var(--hover);
            color: var(--text-main);
        }
        .settings-bar {
            padding: 10px;
            background-color: var(--bg-server);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .settings-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
        }

        /* Main Chat Area */
        .chat-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-chat);
        }
        .chat-header {
            padding: 16px;
            font-weight: bold;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            display: flex;
            flex-direction: column;
        }
        .msg-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }
        .msg-author {
            font-weight: bold;
            color: var(--text-main);
            cursor: pointer;
        }
        .msg-author:hover {
            text-decoration: underline;
        }
        .msg-text {
            margin-top: 5px;
            word-break: break-word;
        }
        .msg-image {
            max-width: 300px;
            max-height: 300px;
            border-radius: 8px;
            margin-top: 8px;
            cursor: pointer;
        }
        .input-area {
            padding: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .chat-input {
            flex-grow: 1;
            background-color: var(--bg-sidebar);
            border: none;
            color: var(--text-main);
            padding: 15px;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
        }
        .upload-btn {
            background-color: var(--bg-sidebar);
            color: var(--text-muted);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .upload-btn:hover {
            background-color: var(--hover);
            color: var(--text-main);
        }

        /* Right Member/Profile List */
        .member-list {
            width: 240px;
            background-color: var(--bg-sidebar);
            padding: 20px 10px;
            overflow-y: auto;
        }
        .member {
            padding: 8px;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 4px;
        }
        .member:hover {
            background-color: var(--hover);
            color: var(--text-main);
        }

        #rules-content {
            display: none;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- Server Bar -->
    <div class="server-bar">
        <div class="server-icon active-server" id="pub-icon" title="Public Server">PUB</div>
        <div class="server-icon" id="dm-icon" title="Direct Messages">DMs</div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header" id="sidebar-title">Public Server</div>
        <div class="channel-list" id="channel-list">
            <div class="channel active" onclick="switchChannel('general')"># general</div>
            <div class="channel" onclick="switchChannel('rules')"># rules</div>
        </div>
        <div class="settings-bar">
            <span id="display-name">Loading...</span>
            <div>
                <button class="settings-btn" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
                <button class="settings-btn" onclick="changeName()" title="Change Name">⚙️</button>
            </div>
        </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area">
        <div class="chat-header" id="chat-header"># general</div>
        
        <div class="messages" id="messages">
            <!-- Messages load here -->
        </div>

        <div id="rules-content">
            <h2>Server Rules</h2>
            <ol>
                <li>No slurs or offensive language. The automod will censor it.</li>
                <li>No NSFW content or discussions.</li>
                <li>Be respectful to others in the chat.</li>
            </ol>
        </div>

        <div class="input-area" id="input-area">
            <input type="file" id="image-file-input" accept="image/*" style="display: none;" onchange="handleImageUpload(event)">
            <button class="upload-btn" onclick="document.getElementById('image-file-input').click()" title="Send Image">📷</button>
            <input type="text" class="chat-input" id="message-input" placeholder="Message #general" onkeypress="handleKeyPress(event)">
        </div>
    </div>

    <!-- Right Panel -->
    <div class="member-list" id="member-list-ui">
        <div style="font-size: 12px; font-weight: bold; margin-bottom: 10px; color: var(--text-muted);">ONLINE</div>
        <!-- Members load here -->
    </div>

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDegqgPPUUXHnfe3ZcZ8K8BG4t-RUEVlUQ",
            authDomain: "publicchat-1a6fa.firebaseapp.com",
            databaseURL: "https://publicchat-1a6fa-default-rtdb.firebaseio.com/",
            projectId: "publicchat-1a6fa",
            storageBucket: "publicchat-1a6fa.firebasestorage.app",
            messagingSenderId: "955917233953",
            appId: "1:955917233953:web:fb8f38bc2bd1b0ace29860"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // User Setup
        let myName = localStorage.getItem("chatUsername");
        if (!myName) {
            myName = prompt("Enter your username:");
            localStorage.setItem("chatUsername", myName);
        }
        document.getElementById("display-name").innerText = myName;

        set(ref(db, 'users/' + myName), { online: true });

        // App States
        let currentServer = "public"; 
        let currentChannel = "general"; 
        let onlineUsersSnapshot = null;
        let dmsSnapshot = null;

        // Moderation Filter
        const blocklist = ["slur1", "slur2", "nsfwword1", "nsfwword2"];
        
        window.filterMessage = function(text) {
            let filtered = text;
            blocklist.forEach(word => {
                const regex = new RegExp(`\\b${word}\\b`, "gi");
                filtered = filtered.replace(regex, "***");
            });
            return filtered;
        }

        loadPublicMessages();

        function loadPublicMessages() {
            if (currentServer !== "public" || currentChannel !== "general") return;
            const messagesDiv = document.getElementById("messages");
            messagesDiv.innerHTML = "";
            
            onChildAdded(ref(db, 'messages/general'), (snapshot) => {
                if (currentServer !== "public" || currentChannel !== "general") return;
                const data = snapshot.val();
                appendMessage(data.author, data.text, data.imageUrl);
            });
        }

        function appendMessage(author, text, imageUrl) {
            const messagesDiv = document.getElementById("messages");
            const msgElement = document.createElement("div");
            msgElement.className = "message";
            
            let contentHTML = '';
            if (text) {
                contentHTML += `<div class="msg-text">${text}</div>`;
            }
            if (imageUrl) {
                contentHTML += `<div><img src="${imageUrl}" class="msg-image" onclick="window.open('${imageUrl}', '_blank')"></div>`;
            }

            msgElement.innerHTML = `
                <div class="msg-header">
                    <span class="msg-author" onclick="startDM('${author}')">${author}</span>
                </div>
                ${contentHTML}
            `;
            messagesDiv.appendChild(msgElement);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Send Text Message
        window.handleKeyPress = function(e) {
            if (e.key === 'Enter') {
                const input = document.getElementById("message-input");
                let text = input.value.trim();
                
                if (text !== "") {
                    text = filterMessage(text);
                    sendMessageData(text, null);
                    input.value = "";
                }
            }
        }

        // Handle Image Upload & Conversion
        window.handleImageUpload = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Image = e.target.result;
                sendMessageData("", base64Image);
            };
            reader.readAsDataURL(file);
            event.target.value = ""; // Reset file input
        }

        function sendMessageData(text, imageUrl) {
            if (currentServer === "public" && currentChannel === "general") {
                push(ref(db, 'messages/general'), {
                    author: myName,
                    text: text,
                    imageUrl: imageUrl || "",
                    timestamp: Date.now()
                });
            } else if (currentServer === "dm" && currentChannel !== "") {
                const dmPathId = [myName, currentChannel].sort().join("_");
                push(ref(db, 'dms/' + dmPathId), {
                    author: myName,
                    text: text,
                    imageUrl: imageUrl || "",
                    timestamp: Date.now()
                });
            }
        }

        function renderPublicSidebar() {
            document.getElementById("sidebar-title").innerText = "Public Server";
            document.getElementById("channel-list").innerHTML = `
                <div class="channel ${currentChannel === 'general' ? 'active' : ''}" onclick="switchChannel('general')"># general</div>
                <div class="channel ${currentChannel === 'rules' ? 'active' : ''}" onclick="switchChannel('rules')"># rules</div>
            `;

            const memberListUI = document.getElementById("member-list-ui");
            memberListUI.innerHTML = '<div style="font-size: 12px; font-weight: bold; margin-bottom: 10px; color: var(--text-muted);">ONLINE</div>';
            if (onlineUsersSnapshot) {
                onlineUsersSnapshot.forEach((childSnapshot) => {
                    const user = childSnapshot.key;
                    const memDiv = document.createElement("div");
                    memDiv.className = "member";
                    memDiv.innerText = user;
                    memDiv.onclick = () => startDM(user);
                    memberListUI.appendChild(memDiv);
                });
            }
        }

        function renderDMSidebar() {
            document.getElementById("sidebar-title").innerText = "Direct Messages";
            const channelList = document.getElementById("channel-list");
            channelList.innerHTML = '<div style="font-size: 11px; font-weight: bold; margin-bottom: 8px; color: var(--text-muted); padding: 4px;">DIRECT MESSAGES</div>';

            const contacts = new Set();
            if (onlineUsersSnapshot) {
                onlineUsersSnapshot.forEach(child => {
                    if (child.key !== myName) contacts.add(child.key);
                });
            }
            if (dmsSnapshot) {
                dmsSnapshot.forEach(child => {
                    const pathId = child.key;
                    if (pathId.includes(myName)) {
                        const parts = pathId.split("_");
                        const otherUser = parts[0] === myName ? parts[1] : parts[0];
                        if (otherUser && otherUser !== myName) contacts.add(otherUser);
                    }
                });
            }

            if (contacts.size === 0) {
                channelList.innerHTML += '<div style="color: var(--text-muted); font-size: 12px; padding: 4px;">No users available.</div>';
            } else {
                contacts.forEach(user => {
                    const dmDiv = document.createElement("div");
                    dmDiv.className = "channel" + (currentChannel === user ? " active" : "");
                    dmDiv.innerHTML = `👤 ${user}`;
                    dmDiv.onclick = () => startDM(user);
                    channelList.appendChild(dmDiv);
                });
            }
        }

        onValue(ref(db, 'users'), (snapshot) => {
            onlineUsersSnapshot = snapshot;
            if (currentServer === "public") {
                renderPublicSidebar();
            } else {
                renderDMSidebar();
            }
        });

        onValue(ref(db, 'dms'), (snapshot) => {
            dmsSnapshot = snapshot;
            if (currentServer === "dm") {
                renderDMSidebar();
            }
        });

        window.switchChannel = function(channel) {
            currentServer = "public";
            currentChannel = channel;

            document.getElementById("pub-icon").classList.add("active-server");
            document.getElementById("dm-icon").classList.remove("active-server");

            renderPublicSidebar();

            const msgs = document.getElementById("messages");
            const inputArea = document.getElementById("input-area");
            const rules = document.getElementById("rules-content");
            const header = document.getElementById("chat-header");

            if (channel === 'rules') {
                msgs.style.display = "none";
                inputArea.style.display = "none";
                rules.style.display = "block";
                header.innerText = "# rules";
            } else {
                msgs.style.display = "flex";
                inputArea.style.display = "flex";
                rules.style.display = "none";
                header.innerText = "# general";
                loadPublicMessages();
            }
        }

        window.switchToDMHome = function() {
            currentServer = "dm";
            currentChannel = "";

            document.getElementById("pub-icon").classList.remove("active-server");
            document.getElementById("dm-icon").classList.add("active-server");

            renderDMSidebar();

            document.getElementById("chat-header").innerText = "Direct Messages";
            document.getElementById("rules-content").style.display = "none";
            document.getElementById("messages").style.display = "flex";
            document.getElementById("messages").innerHTML = `
                <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); text-align: center;">
                    <h3>Direct Messages</h3>
                    <p>Select a user from the left sidebar to start chatting privately.</p>
                </div>
            `;
            document.getElementById("input-area").style.display = "none";

            document.getElementById("member-list-ui").innerHTML = `
                <div style="font-size: 12px; font-weight: bold; margin-bottom: 10px; color: var(--text-muted);">PROFILE</div>
                <div style="color: var(--text-muted); font-size: 13px; padding: 4px;">Select a user to view profile</div>
            `;
        }

        window.startDM = function(targetUser) {
            if (targetUser === myName) return;

            currentServer = "dm";
            currentChannel = targetUser;

            document.getElementById("pub-icon").classList.remove("active-server");
            document.getElementById("dm-icon").classList.add("active-server");

            renderDMSidebar();

            document.getElementById("chat-header").innerText = `@ ${targetUser}`;
            document.getElementById("input-area").style.display = "flex";
            document.getElementById("rules-content").style.display = "none";
            document.getElementById("messages").style.display = "flex";
            document.getElementById("messages").innerHTML = "";
            document.getElementById("message-input").placeholder = `Message @${targetUser}`;

            document.getElementById("member-list-ui").innerHTML = `
                <div style="display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 15px;">
                    <div style="width: 72px; height: 72px; background-color: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; color: white; margin-bottom: 10px;">
                        ${targetUser.charAt(0).toUpperCase()}
                    </div>
                    <div style="font-weight: bold; font-size: 16px; color: var(--text-main);">${targetUser}</div>
                    <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 20px;">@${targetUser.toLowerCase()}</div>
                    <div style="width: 100%; background: var(--bg-chat); padding: 10px; border-radius: 8px; text-align: left; font-size: 12px; margin-bottom: 15px;">
                        <div style="font-weight: bold; margin-bottom: 4px; color: var(--text-muted); font-size: 10px;">ABOUT ME</div>
                        <div>Encrypted private session between classes.</div>
                    </div>
                </div>
            `;

            const dmPathId = [myName, targetUser].sort().join("_");
            const messagesDiv = document.getElementById("messages");

            onValue(ref(db, 'dms/' + dmPathId), (snapshot) => {
                if (currentServer !== "dm" || currentChannel !== targetUser) return;
                messagesDiv.innerHTML = "";
                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    appendMessage(data.author, data.text, data.imageUrl);
                });
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });
        }

        document.getElementById("pub-icon").onclick = function() {
            switchChannel('general');
        };
        document.getElementById("dm-icon").onclick = function() {
            switchToDMHome();
        };

        window.toggleTheme = function() {
            const body = document.body;
            if (body.getAttribute("data-theme") === "light") {
                body.removeAttribute("data-theme");
            } else {
                body.setAttribute("data-theme", "light");
            }
        }

        window.changeName = function() {
            const newName = prompt("Enter new username:");
            if (newName) {
                set(ref(db, 'users/' + myName), null);
                myName = newName;
                localStorage.setItem("chatUsername", myName);
                document.getElementById("display-name").innerText = myName;
                set(ref(db, 'users/' + myName), { online: true });
            }
        }
    </script>
</body>
</html>
